name: Deploy Firebase Infra

on:
  push:
    branches: [development, production]

jobs:
  deploy:
    name: Deploy Rules & Indexes → Firebase (${{ github.ref_name }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules e índices
        run: firebase deploy --only firestore --project museo-infamia-vzla
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Storage rules
        run: firebase deploy --only storage --project museo-infamia-vzla
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}